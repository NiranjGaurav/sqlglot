---
apiVersion: v1
kind: Service
metadata:
  name: fastapi
  namespace: sqlglot
  labels:
    app: fastapi
spec:
  selector:
    app: fastapi
  ports:
    - port: 8080
      targetPort: 8100
      nodePort: 30080
  type: NodePort

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: sqlglot
  labels:
    app: fastapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: sqlglot/api:latest
          imagePullPolicy: Never  # For minikube local images
          ports:
            - containerPort: 8100
          env:
            - name: CELERY_BROKER_URL
              value: "redis://redis:6379/0"
            - name: CELERY_RESULT_BACKEND
              value: "redis://redis:6379/0"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: aws-credentials
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: results
              mountPath: /app/results
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: results
          emptyDir: {}
        - name: logs
          emptyDir: {}
      restartPolicy: Always