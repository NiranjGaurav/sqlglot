apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: transpiler-prod
  labels:
    app: frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  selector:
    app: frontend
  ports:
    - port: {{ .Values.frontend.service.servicePorts.port }}
      targetPort: {{ .Values.frontend.service.servicePorts.targetPort }}
  type: {{ .Values.frontend.service.type }}