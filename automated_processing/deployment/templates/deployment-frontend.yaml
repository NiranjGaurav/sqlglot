apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: transpiler-prod
  labels:
    app: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: {{ printf "%s:%s" .Values.frontend.image .Values.frontend.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.frontend.service.servicePorts.targetPort }}
          env:
            {{- range $k, $v := .Values.frontend.env }}
            - name: {{ $k }}
              value: "{{ $v }}"
            {{- end }}
      restartPolicy: Always
      tolerations: {{ toYaml .Values.commonTolerations | nindent 8 }}