{{- if .Values.worker.hpa.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "sqlglot-backend.fullname" . }}-worker
  labels:
    {{- include "sqlglot-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "sqlglot-backend.fullname" . }}-worker
  minReplicas: {{ .Values.worker.hpa.minReplicas }}
  maxReplicas: {{ .Values.worker.hpa.maxReplicas }}
  metrics:
  {{- if .Values.worker.hpa.metrics.cpu.enabled }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.worker.hpa.metrics.cpu.targetUtilization }}
  {{- end }}
  {{- if .Values.worker.hpa.metrics.memory.enabled }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.worker.hpa.metrics.memory.targetUtilization }}
  {{- end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.worker.hpa.behavior.scaleDown.stabilizationWindowSeconds }}
      policies:
      - type: Percent
        value: {{ .Values.worker.hpa.behavior.scaleDown.percentValue }}
        periodSeconds: {{ .Values.worker.hpa.behavior.scaleDown.periodSeconds }}
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.worker.hpa.behavior.scaleUp.stabilizationWindowSeconds }}
      policies:
      - type: Percent
        value: {{ .Values.worker.hpa.behavior.scaleUp.percentValue }}
        periodSeconds: {{ .Values.worker.hpa.behavior.scaleUp.periodSeconds }}
{{- end }}