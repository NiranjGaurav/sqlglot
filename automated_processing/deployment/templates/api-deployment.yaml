apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sqlglot-backend.fullname" . }}-api
  labels:
    {{- include "sqlglot-backend.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "sqlglot-backend.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sqlglot-backend.api.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- if .Values.iceberg.persistence.enabled }}
          volumeMounts:
            - name: iceberg-storage
              mountPath: /app/iceberg_warehouse
          {{- end }}
          {{- if .Values.healthCheck.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.api.path }}
              port: {{ .Values.healthCheck.api.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.api.path }}
              port: {{ .Values.healthCheck.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 5
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- if .Values.iceberg.persistence.enabled }}
      volumes:
        - name: iceberg-storage
          persistentVolumeClaim:
            claimName: {{ include "sqlglot-backend.fullname" . }}-iceberg-pvc
      {{- end }}