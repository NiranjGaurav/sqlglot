# Default values for sqlglot-backend
api:
  replicaCount: 1  # Multiple API instances for load handling
  image:
    repository: sqlglot-api
    pullPolicy: Never  # For Minikube - change to "Always" for EKS/ECR
    tag: "latest"
  service:
    type: NodePort
    port: 8080
    nodePort: 30100  # For Minikube access
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

worker:
  replicaCount: 1  # Keep at 1 - HPA will manage scaling
  image:
    repository: sqlglot-worker
    pullPolicy: Never  # For Minikube - change to "Always" for EKS/ECR
    tag: "latest"
  resources:
    limits:
      cpu: 4000m      # Increased for SQL processing workload
      memory: 8Gi
    requests:
      cpu: 500m       # Lower baseline for better scheduling
      memory: 1Gi
  
  # Horizontal Pod Autoscaler configuration
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 20
    metrics:
      cpu:
        enabled: true
        targetUtilization: 70
      memory:
        enabled: true
        targetUtilization: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300  # Wait 5 min before scaling down
        percentValue: 10                 # Scale down by 10% at a time
        periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 60   # Quick scale up for high load
        percentValue: 100                # Double capacity when needed
        periodSeconds: 15

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  resources:
    limits:
      cpu: 1000m      # Increased for better performance
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi
  # Redis performance configuration
  config: |
    maxmemory 1536mb
    maxmemory-policy allkeys-lru
    tcp-keepalive 60
    timeout 300
    save 900 1
    save 300 10
    save 60 10000

# Environment variables
env:
  - name: CELERY_BROKER_URL
    value: "redis://sqlglot-backend-redis:6379/0"
  - name: CELERY_RESULT_BACKEND
    value: "redis://sqlglot-backend-redis:6379/0"
  - name: PYTHONUNBUFFERED
    value: "1"
  - name: ENABLE_GUARDRAIL
    value: "False"
  - name: ENVIRONMENT
    value: "development"
  - name: UVICORN_WORKERS
    value: "1"

# Health checks
healthCheck:
  enabled: true
  api:
    path: "/health"
    port: 8080