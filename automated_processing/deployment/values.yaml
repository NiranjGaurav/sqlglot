namespace: transpiler-prod

automatedApi:
  image: 670514002493.dkr.ecr.us-east-1.amazonaws.com/batch-transpiler
  tag: latest
  replicaCount: 1
  imagePullPolicy: Always
  service:
    type: LoadBalancer
    servicePorts:
      port: 8101
      targetPort: 8101
  env:
    CELERY_BROKER_URL : "redis://redis:6379/0"
    CELERY_RESULT_BACKEND : "redis://redis:6379/0"
    PYTHONUNBUFFERED : "1"
    AWS_DEFAULT_REGION : "us-east-1"
  resources:
    requests:
      memory: "4Gi"       # Increased for large file processing
      cpu: "2"            # Guaranteed 2 CPU cores for API/orchestration
      ephemeral-storage: "2Gi"
    limits:
      memory: "8Gi"       # Can handle large file processing (1.7GB+ files)
      cpu: "4"            # Can burst up to 4 CPU cores
      ephemeral-storage: "4Gi"

frontend:
  image: 670514002493.dkr.ecr.us-east-1.amazonaws.com/batch-transpiler-frontend
  tag: latest
  replicaCount: 1
  service:
    type: LoadBalancer
    servicePorts:
      port: 3000
      targetPort: 3000
  env:
    NODE_ENV : "production"
    API_URL: "http://automated-api:8101"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

worker:
  image: 670514002493.dkr.ecr.us-east-1.amazonaws.com/transpiler-celery-worker
  tag: latest
  replicaCount: 5  # Scale to 5 replicas for high-volume processing
  imagePullPolicy: Always
  env:
    CELERY_BROKER_URL : "redis://redis:6379/0"
    CELERY_RESULT_BACKEND : "redis://redis:6379/0"
    PYTHONUNBUFFERED: "1"
    OMP_NUM_THREADS : "1"
    ARROW_ENABLE_NULL_CHECK_FOR_GET : "0"
    ARROW_ENABLE_TIMING_TESTS : "0"
    AWS_DEFAULT_REGION : "us-east-1"
  resources:
    requests:
      memory: "4Gi"   # Guaranteed resources for large query processing
      cpu: "2"        # Guaranteed 2 CPU cores per worker
    limits:
      memory: "8Gi"   # Can use up to 8GB if available
      cpu: "4"        # Can burst up to 4 CPU cores

# AWS Configuration for EKS
aws:
  region: "us-east-1"
  s3Bucket: "batch-transpiler"
  icebergCatalog: "glue_catalog"
  useSecrets: true

# Application Configuration
application:
  enableGuardrail: "False"
  storageEngineUrl: "localhost"
  storageEnginePort: "9005"
  uvicornWorkers: "4"

# Redis Service
redis:
  image: redis:7-alpine
  replicaCount: 1
  servicePorts:
    port: 6379
    targetPort: 6379
  persistence:
    enabled: true  # Set to true for production
    size: 8Gi
    storageClass: "gp2"  # Use gp2 (more commonly available than gp3)
  resources:
    requests:
      memory: "2Gi"
      cpu: "100m"
    limits:
      memory: "6Gi"
      cpu: "200m"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: transpiler-tls
  #    hosts:
  #      - transpiler.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.

